server:
  port: 8080

spring:
  application:
    name: yunshang-market-server
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/yunshang_market?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-hours: 8
logging:
  level:
    com.yunshang.market: info
